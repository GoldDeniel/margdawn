[workspace]
resolver = "2"
members = [
    "crates/margdawn-core",
    "crates/margdawn-cli",
    "crates/margdawn-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["golddeniel"]
description = "A minimal, fast Markdown viewer for the terminal and the desktop."

[workspace.dependencies]
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
thiserror = "1"
eframe = "0.28"
rfd = "0.14"

[profile.release]
lto = true
strip = true
