[package]
name = "margdawn-gui"
description = "Minimal Markdown viewer (desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
margdawn-core = { path = "../margdawn-core" }
eframe = { workspace = true }
rfd = { workspace = true }
# Clipboard with an HTML flavour, so a copy pastes into a word processor with
# its formatting. egui-winit already pulls this in, but only uses set_text.
arboard = { version = "3.7", features = ["wayland-data-control"] }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[package.metadata.generate-rpm]
license = "MIT"
summary = "Minimal Markdown viewer (terminal + GUI)"
auto_req = "builtin"
post_install_script = "update-desktop-database -q || true"
post_uninstall_script = "update-desktop-database -q || true"

[[package.metadata.generate-rpm.assets]]
source = "../../target/release/margdawn"
dest = "/usr/bin/margdawn"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "../../target/release/margdawn-gui"
dest = "/usr/bin/margdawn-gui"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "assets/margdawn-gui.desktop"
dest = "/usr/share/applications/margdawn-gui.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "assets/margdawn-gui.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/margdawn-gui.svg"
mode = "644"

[package.metadata.generate-rpm.requires]
shared-mime-info = "*"

[package.metadata.deb]
maintainer = "golddeniel <golddeniel@localhost>"
# `$auto` needs dpkg-shlibdeps, which only exists on Debian hosts — on a Fedora
# build it silently resolves to nothing and the package ships with an empty
# Depends line. eframe/glutin dlopen the window and GL libraries at runtime, so
# ldd does not see them either; list them explicitly instead.
depends = "libc6, libgcc-s1, libgl1, libegl1, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon0, libwayland-client0, libfontconfig1, libfreetype6"
section = "utils"
priority = "optional"
extended-description = "A minimal, fast Markdown viewer that renders .md files in a themed GUI (margdawn-gui) or in the terminal (margdawn)."

[[package.metadata.deb.assets]]
source = "../../target/release/margdawn"
dest = "/usr/bin/margdawn"
mode = "755"

[[package.metadata.deb.assets]]
source = "../../target/release/margdawn-gui"
dest = "/usr/bin/margdawn-gui"
mode = "755"

[[package.metadata.deb.assets]]
source = "assets/margdawn-gui.desktop"
dest = "/usr/share/applications/margdawn-gui.desktop"
mode = "644"

[[package.metadata.deb.assets]]
source = "assets/margdawn-gui.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/margdawn-gui.svg"
mode = "644"
